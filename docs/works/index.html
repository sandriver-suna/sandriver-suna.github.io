<!doctype html>
<html lang="ja" data-style="midnight">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="砂が制作したゲームの一覧。">
  <meta name="theme-color" content="#080b1b">
  <title>制作物一覧 — 砂の砂場</title>
  <script src="/analytics-config.js"></script>
  <script>
    (() => {
      const measurementId = window.SAND_ANALYTICS_CONFIG?.ga4MeasurementId?.trim();
      if (!/^G-[A-Z0-9]{6,}$/i.test(measurementId || '')) return;

      const analyticsScript = document.createElement('script');
      analyticsScript.async = true;
      analyticsScript.src = 'https://www.googletagmanager.com/gtag/js?id=' + encodeURIComponent(measurementId);
      document.head.appendChild(analyticsScript);

      window.dataLayer = window.dataLayer || [];
      window.gtag = function () { window.dataLayer.push(arguments); };
      window.gtag('js', new Date());
      window.gtag('config', measurementId);
    })();
  </script>
  <script>
    (() => {
      const styles = ['midnight', 'gameboy'];
      const cookieName = 'sand_style';
      let saved;
      try { saved = document.cookie.split('; ').find((row) => row.startsWith(cookieName + '=')); }
      catch (_) { saved = undefined; }
      let style = saved ? saved.split('=').slice(1).join('=') : '';
      if (!styles.includes(style)) {
        let index;
        try { const value = new Uint32Array(1); crypto.getRandomValues(value); index = value[0] % styles.length; }
        catch (_) { index = Math.floor(Math.random() * styles.length); }
        style = styles[index];
        try { document.cookie = cookieName + '=' + style + '; Max-Age=21600; Path=/; SameSite=Lax; Secure'; }
        catch (_) { /* The page can still use the selected style for this visit. */ }
      }
      document.documentElement.dataset.style = style;
      window.__sandStyle = style;
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&amp;family=DotGothic16&amp;family=Noto+Sans+JP:wght@400;500;700;900&amp;family=Shippori+Mincho:wght@400;600;700&amp;family=Space+Grotesk:wght@400;600;700&amp;display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23202a22'/%3E%3Cpath d='M18 20h28v6H18zm0 12h20v6H18zm0 12h12v6H18z' fill='%23f2efdf'/%3E%3Ccircle cx='46' cy='44' r='6' fill='%23ff4f34'/%3E%3C/svg%3E">
  <style>
    :root {
      --bg:#f2efdf; --fg:#202a22; --muted:#596159; --accent:#ff4f34; --accent2:#f5c945; --card:#fff; --rule:rgba(32,42,34,.25);
      --sans:"Noto Sans JP",system-ui,sans-serif; --display:"Noto Sans JP",system-ui,sans-serif; --mono:"DM Mono",monospace;
      --wrap:min(1080px,calc(100% - 40px));
    }
    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body { margin:0; min-width:320px; color:var(--fg); background:var(--bg); font:16px/1.75 var(--sans); }
    a { color:inherit; }
    .skip-link { position:fixed; z-index:20; top:10px; left:10px; padding:10px 14px; color:var(--bg); background:var(--fg); font:700 14px/1.4 var(--sans); text-decoration:none; transform:translateY(-160%); transition:transform .18s ease; }
    .skip-link:focus { transform:translateY(0); outline:3px solid var(--accent); outline-offset:3px; }
    .wrap { width:var(--wrap); margin-inline:auto; }
    header { min-height:82px; display:flex; align-items:center; justify-content:space-between; gap:20px; border-bottom:1px solid var(--rule); }
    .home { font:500 14px/1.2 var(--mono); text-decoration:none; }
    .edition { font:12px/1.2 var(--mono); letter-spacing:.08em; text-transform:uppercase; }
    .hero { min-height:300px; display:grid; align-items:center; padding:58px 0; border-bottom:1px solid var(--rule); }
    .eyebrow { margin:0 0 20px; font:13px/1.2 var(--mono); letter-spacing:.12em; text-transform:uppercase; }
    h1 { margin:0; font:900 clamp(4rem,9vw,7.5rem)/.9 var(--display); letter-spacing:-.09em; }
    .intro { max-width:20rem; margin:0; font-size:1.15rem; font-weight:700; }
    .count { display:block; margin-top:20px; color:var(--muted); font:12px/1.4 var(--mono); text-transform:uppercase; }
    .intro .count { color:inherit; }
    .works { padding:48px 0 90px; }
    .work { position:relative; display:grid; grid-template-columns:64px minmax(340px,1.25fr) minmax(280px,.75fr); grid-template-rows:auto 1fr; gap:24px 30px; align-items:start; min-height:390px; padding:34px; color:var(--fg); background:var(--card); border:2px solid var(--fg); text-decoration:none; transition:transform .22s,box-shadow .22s,color .2s,background .2s; }
    .work > * { min-width:0; }
    .work + .work { margin-top:24px; }
    .number { grid-row:1 / span 2; align-self:start; font:13px/1.2 var(--mono); }
    .work-art { grid-row:1 / span 2; width:100%; aspect-ratio:973/615; display:block; object-fit:cover; border:1px solid currentColor; }
    .work-copy { min-width:0; }
    .work h2 { margin:0 0 10px; font:900 clamp(2.8rem,7vw,6rem)/.9 var(--display); letter-spacing:-.075em; }
    .work p { max-width:39rem; margin:0; }
    .facts { align-self:end; font:12px/1.7 var(--mono); text-transform:uppercase; }
    .action { display:block; margin-top:18px; font-weight:700; text-decoration:underline; text-underline-offset:.3em; }
    .work:hover, .work:focus-visible { outline:0; transform:translate(-5px,-5px); box-shadow:9px 9px 0 var(--fg); }
    .soon { grid-template-columns:110px minmax(0,1fr) 170px; grid-template-rows:1fr; min-height:160px; border-style:dashed; background:transparent; opacity:.66; }
    .soon .number { grid-row:auto; }
    .soon:hover { transform:none; box-shadow:none; }
    footer { min-height:180px; display:flex; justify-content:space-between; align-items:flex-end; gap:30px; padding:46px 0; border-top:1px solid var(--rule); }
    footer p { margin:0; }
    .mark { font-size:5rem; font-weight:900; line-height:.7; }

    html[data-style="midnight"] { --bg:#080b1b; --fg:#f6f4ff; --muted:#9ea5c9; --accent:#ff3ea5; --accent2:#b9ff39; --card:#11162e; --rule:rgba(81,217,255,.28); --display:"Space Grotesk","Noto Sans JP",sans-serif; }
    html[data-style="midnight"] body { background:radial-gradient(circle at 85% 15%,rgba(81,217,255,.2),transparent 28rem),linear-gradient(120deg,rgba(255,62,165,.1),transparent 38%),var(--bg); }
    html[data-style="midnight"] .edition { color:var(--accent2); }
    html[data-style="midnight"] h1 { text-transform:uppercase; text-shadow:5px 5px 0 rgba(255,62,165,.65),-4px -4px 0 rgba(81,217,255,.35); }
    html[data-style="midnight"] .intro { padding:24px; color:var(--bg); background:var(--accent2); border-radius:999px 999px 16px 999px; transform:rotate(-3deg); }
    html[data-style="midnight"] .work { border:1px solid var(--rule); border-radius:4px; background:linear-gradient(145deg,#161c3b,#0d1125); }
    html[data-style="midnight"] .work:first-child::after { content:""; position:absolute; inset:auto 0 0; height:4px; background:linear-gradient(90deg,var(--accent),#51d9ff); }
    html[data-style="midnight"] .work:hover { transform:translateY(-7px); box-shadow:0 20px 55px rgba(0,0,0,.5),0 0 24px rgba(81,217,255,.14); }

    html[data-style="gameboy"] { --bg:#9bbc0f; --fg:#0f380f; --muted:#306230; --accent:#0f380f; --accent2:#8bac0f; --card:#8bac0f; --rule:rgba(15,56,15,.62); --sans:"DotGothic16",monospace; --display:"DotGothic16",monospace; --mono:"DM Mono",monospace; --wrap:min(920px,calc(100% - 36px)); }
    html[data-style="gameboy"] body { background:repeating-linear-gradient(0deg,rgba(15,56,15,.07) 0 1px,transparent 1px 4px),var(--bg); image-rendering:pixelated; }
    html[data-style="gameboy"] header, html[data-style="gameboy"] .hero { border-color:var(--fg); }
    html[data-style="gameboy"] .edition { color:var(--muted); }
    html[data-style="gameboy"] h1 { font-weight:400; letter-spacing:.02em; line-height:1; text-shadow:4px 4px 0 var(--accent2); }
    html[data-style="gameboy"] .work { border:4px solid var(--fg); background:var(--card); box-shadow:7px 7px 0 var(--fg); }
    html[data-style="gameboy"] .work-art { filter:grayscale(1) contrast(1.12) sepia(.5) hue-rotate(38deg) saturate(.72); mix-blend-mode:multiply; }
    html[data-style="gameboy"] .work h2 { font-weight:400; letter-spacing:.01em; }
    html[data-style="gameboy"] .work:hover { transform:translate(-3px,-3px); box-shadow:10px 10px 0 var(--fg); }
    html[data-style="gameboy"] .soon { border:3px dashed var(--fg); background:transparent; box-shadow:none; }
    html[data-style="gameboy"] .soon:hover { transform:none; box-shadow:none; }
    html[data-style="gameboy"] footer { border-color:var(--fg); }

    @media (max-width:980px) {
      :root { --wrap:min(100% - 24px,680px); }
      header { min-height:66px; }
      .edition { font-size:10px; }
      .hero { min-height:0; grid-template-columns:1fr; gap:34px; padding:52px 0; }
      h1 { font-size:clamp(4rem,20vw,7rem); }
      .intro { justify-self:start; max-width:82%; }
      .works { padding:42px 0 64px; }
      .work, html[data-style] .work { grid-template-columns:minmax(0,1fr); gap:18px; min-height:300px; padding:26px; }
      .work .number, .work .work-art { grid-row:auto; }
      .facts { align-self:auto; }
      footer { min-height:150px; }
    }
    @media (prefers-reduced-motion:reduce) { html { scroll-behavior:auto!important; } *,*::before,*::after { animation:none!important; transition:none!important; } }
  </style>
</head>
<body>
  <a class="skip-link" href="#main-content">本文へ移動</a>
  <header class="wrap"><a class="home" href="/">砂の砂場 / HOME</a><span class="edition" id="edition-name">random edition</span></header>
  <main id="main-content" tabindex="-1">
    <section class="hero wrap">
      <div><h1>制作物</h1></div>
    </section>
    <section class="works wrap" aria-label="制作物一覧">
      <a class="work released" href="https://novelgame.jp/games/show/12951" target="_blank" rel="noreferrer">
        <span class="number">01 / RELEASED</span>
        <img class="work-art" src="/assets/game-1999.png" alt="『1999』のキービジュアル" width="973" height="615" decoding="async">
        <div class="work-copy"><h2>1999</h2><p>永遠に続く、1999年7月の夏休み。<br>ループする世紀末の夏休みに閉じ込められた二人の女の子の話です。</p><span class="action">ブラウザで遊ぶ →</span></div>
        <div class="facts">ブラウザゲーム<br>プレイ時間：約15分</div>
      </a>
    </section>
  </main>
  <footer class="wrap"><div><p>© 2026 砂</p></div></footer>
  <script>
    const names={midnight:'edition 01 / midnight',gameboy:'edition 02 / game boy'};
    const colors={midnight:'#080b1b',gameboy:'#9bbc0f'};
    const style=window.__sandStyle||'midnight';
    document.querySelector('#edition-name').textContent=names[style];
    document.querySelector('meta[name="theme-color"]').setAttribute('content',colors[style]);
  </script>
</body>
</html>
